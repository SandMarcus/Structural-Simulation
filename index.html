<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Structural Simulation</title><style>body{margin:0;background:#f3f6fb;color:#21334a;font-family:system-ui}header{background:white;padding:22px 32px;border-bottom:1px solid #dde5ef;font-size:24px;font-weight:700}main{max-width:850px;margin:50px auto;background:white;border:1px solid #dce5f0;border-radius:18px;padding:32px}p{color:#586b80}button{background:#215da4;color:white;border:0;border-radius:9px;padding:13px 20px;cursor:pointer}pre{background:#f1f5fa;padding:20px;border-radius:12px;white-space:pre-wrap}</style><header>⬡ Structural Simulation</header><main><h1>3D Structural Analysis</h1><p>Prototype v0.1 — model upload and basic STL inspection. FEA calculations are not yet implemented.</p><input id="file" type="file" accept=".stl"><pre id="out">Choose an STL file to inspect its size and triangle count.</pre></main><script>document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await f.arrayBuffer(),v=new DataView(b);let triangles=0,format='ASCII';if(b.byteLength>=84&&84+v.getUint32(80,true)*50===b.byteLength){triangles=v.getUint32(80,true);format='Binary'}else{const s=new TextDecoder().decode(b);triangles=(s.match(/facet normal/g)||[]).length}document.getElementById('out').textContent=JSON.stringify({file:f.name,format,triangles,sizeBytes:b.byteLength},null,2)}</script></html>
